# Scrollback — 50,000 lines (default is 2,000)
set -g history-limit 50000

# Mouse ON + auto-copy to the system clipboard
# Scroll: trackpad/wheel works (enters copy mode)
# Select: drag to highlight — auto-copies to clipboard on release, then paste
# Ctrl+b m = toggle mouse off temporarily for native Cmd+C selection
# A GUI terminal that strips mouse-mode sequences is unaffected by this.
set -g mouse on

# Force drag to always enter LOCAL copy mode (bypasses program mouse tracking)
# This ensures drag-select + copy works on remote sessions where Claude's TUI captures mouse
bind-key -T root MouseDrag1Pane copy-mode -M

# Auto-copy selection to clipboard when mouse drag ends.
# macOS: pipe to pbcopy. Elsewhere (Linux, WSL): a plain copy, which tmux
# forwards to the outer terminal's clipboard via OSC 52 — Windows Terminal,
# iTerm2 and most modern terminals honour it (default set-clipboard=external).
if-shell 'command -v pbcopy >/dev/null 2>&1' \
    'bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"; bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"' \
    'bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection-and-cancel; bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel'

# Toggle mouse mode: Ctrl+b m (escape hatch for native selection)
bind-key m set -g mouse \; display-message "Mouse: #{?mouse,ON — scroll mode,OFF — select mode}"

# Session switching shortcuts
# Ctrl-b ( = previous session
# Ctrl-b ) = next session
# Ctrl-b s = session list (interactive)

# fleetmux keybindings
bind-key g run-shell "fleetmux menu"           # prefix+g = session picker popup
bind-key a run-shell "fleetmux dash toggle"    # prefix+a = toggle dashboard pane
